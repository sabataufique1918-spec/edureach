# Edge cache + compression tier. Everything a rural client pulls twice
# should be served from here, not from the API or object store.

proxy_cache_path /var/cache/nginx/edureach levels=1:2 keys_zone=media:50m
                 max_size=5g inactive=30d use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Aggressive text compression - interaction payloads are tiny JSON.
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/css text/plain
             application/manifest+json image/svg+xml application/vnd.apple.mpegurl;

  # PWA shell
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|css|woff2|webp|png|svg)$ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # HLS segments and derived media: immutable, cache hard.
  location /media/ {
    proxy_pass http://api:4000;
    proxy_cache media;
    proxy_cache_valid 200 206 30d;
    proxy_cache_lock on;
    # Range requests are what makes resumable downloads work.
    proxy_force_ranges on;
    add_header X-Cache-Status $upstream_cache_status;
    expires 30d;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 7d;
  }
}
