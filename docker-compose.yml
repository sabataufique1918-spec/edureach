services:
  mongo:
    image: mongo:7
    container_name: edureach-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["./data/mongo:/data/db"]

  redis:
    image: redis:7-alpine
    container_name: edureach-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["./data/redis:/data"]

  minio:
    image: minio/minio:latest
    container_name: edureach-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./data/minio:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      mc mb -p local/edureach-media;
      mc anonymous set download local/edureach-media;
      echo 'bucket ready';
      "

  api:
    build: ./server
    container_name: edureach-api
    restart: unless-stopped
    depends_on: [mongo, redis, minio]
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/edureach
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ANALYTICS_URL: http://analytics:8000
    ports: ["4000:4000"]
    volumes: ["./server:/app", "/app/node_modules"]

  transcoder:
    build: ./server
    container_name: edureach-transcoder
    restart: unless-stopped
    depends_on: [mongo, redis, minio]
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017/edureach
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    command: ["node", "src/workers/transcode.worker.js"]
    volumes: ["./server:/app", "/app/node_modules"]

  analytics:
    build: ./analytics
    container_name: edureach-analytics
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URI: mongodb://mongo:27017/edureach
      ANALYTICS_TOKEN: analytics-shared-secret
    ports: ["8000:8000"]

  nginx:
    image: nginx:alpine
    container_name: edureach-nginx
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
